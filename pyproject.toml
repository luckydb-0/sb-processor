[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sb-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7", "PyMuPDF>=1.24,<2", "openai>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
anydoc = ["firecrawl-anydoc>=0.2.4,<1"]
layout = ["pymupdf4llm>=1.28,<2", "pymupdf-layout>=1.28,<2"]
docling = ["docling>=2.140,<3"]
semantic = ["qdrant-client>=1.14,<2", "fastembed>=0.7,<1"]

[project.scripts]
sb-processor = "sb_processor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sb_processor = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
